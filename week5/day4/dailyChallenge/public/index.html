<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Emoji Game</title>

  <link
    rel="stylesheet"
    href="style.css"
  />

</head>

<body>

  <div class="container">

    <h1>
      Emoji Guessing Game
    </h1>

    <div
      id="emoji"
      class="emoji"
    >
      😀
    </div>

    <div id="options"></div>

    <p id="feedback"></p>

    <h2 id="score">
      Score: 0
    </h2>

    <button id="nextBtn">
      Next Emoji
    </button>

    <hr />

    <input
      id="username"
      type="text"
      placeholder="Your name"
    />

    <button id="saveScoreBtn">
      Save Score
    </button>

    <h2>Leaderboard</h2>

    <ul id="leaderboard"></ul>

  </div>

  <script src="script.js"></script>

</body>

</html>
